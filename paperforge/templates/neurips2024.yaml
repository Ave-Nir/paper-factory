# NeurIPS 2024 模板配置
# 用于 academic-paper-writer 的模板系统，在此作为参考示例

name: "NeurIPS 2024"
year: 2024
document_class: "article"
class_options: []

packages:
  - name: "neurips_2024"
  - name: "inputenc"
    options: ["utf8"]
  - name: "fontenc"
    options: ["T1"]
  - name: "amsmath"
  - name: "amssymb"
  - name: "graphicx"
  - name: "booktabs"
  - name: "hyperref"
  - name: "url"
  - name: "cleveref"

section_order:
  - "introduction"
  - "related_work"
  - "method"
  - "experiments"
  - "conclusion"

citation_style: "numeric"
bibliography_style: "unsrt"
page_limit: 9
column_layout: "single"
font_size: "10pt"
figure_placement_default: "t"
table_placement_default: "t"
anonymous: true
title_page_template: "neurips2024/title_page.tex.j2"

extra_preamble: |
  % NeurIPS 2024 specific settings
  \usepackage[T1]{fontenc}
  \usepackage{hyperref}
  \usepackage{url}
  \usepackage{booktabs}
  \usepackage{amsfonts}
  \usepackage{nicefrac}
  \usepackage{microtype}
  \usepackage{xcolor}

section_composers:
  abstract: "AbstractComposer"
  introduction: "IntroductionComposer"
  related_work: "RelatedWorkComposer"
  method: "MethodComposer"
  experiments: "ExperimentsComposer"
  conclusion: "ConclusionComposer"