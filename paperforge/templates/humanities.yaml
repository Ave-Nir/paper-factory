# 人文社科期刊论文模板（纯中文版）
# 严格约束 LLM 输出纯中文 sections，标题一律中文

name: "Humanities Journal CN"
year: "2026"
document_class: "article"
class_options: ["12pt", "a4paper"]

packages:
  - name: "amsmath"
  - name: "amssymb"
  - name: "graphicx"
  - name: "booktabs"
  - name: "geometry"
  - name: "hyperref"

# 严格纯中文 section 顺序（人文学科论文，标题一律中文）
section_order:
  - "chinese_abstract"
  - "related_work_cn"
  - "research_content"
  - "research_basis"
  - "figures_tables_cn"
  - "conclusion_cn"
  - "references_cn"

citation_style: "numeric"
bibliography_style: "gbt7714-numerical"   # GB/T 7714-2015 中文国标
page_limit: 30
column_layout: "single"
font_size: "12pt"
figure_placement_default: "t"
table_placement_default: "t"
anonymous: false
title_page_template: "base/title_page.tex.j2"

# XeLaTeX 引擎 + 中文
engine: "xelatex"
language: "chinese"

section_composers:
  chinese_abstract: "ChineseAbstractComposer"
  related_work_cn: "ChineseRelatedWorkComposer"
  research_content: "ChineseResearchContentComposer"
  research_basis: "ChineseResearchBasisComposer"
  figures_tables_cn: "ChineseFiguresTablesComposer"
  conclusion_cn: "ChineseConclusionComposer"
  references_cn: "ChineseReferencesComposer"
